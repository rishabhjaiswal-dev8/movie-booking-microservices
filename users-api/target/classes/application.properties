spring.application.name=users-api
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/aicines_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.MOVIES-API.sliding-window-size=5
resilience4j.circuitbreaker.instances.MOVIES-API.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.MOVIES-API.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.MOVIES-API.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.MOVIES-API.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.MOVIES-API.register-health-indicator=true

management.endpoints.web.exposure.include=health.circuitbreakers
management.health.circuitbreakers.enabled=true
